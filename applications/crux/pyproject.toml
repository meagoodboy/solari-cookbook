[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crux"
version = "0.1.0"
description = "Finds the minimal change that flips a stochastic agent's outcome, with statistical evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
live = ["solari-sandbox>=0.2.0"]
browser = ["solari-browser>=0.1.2"]
dev = ["pytest>=8"]

[project.scripts]
crux = "crux.cli:main"

[tool.setuptools.packages.find]
include = ["crux*"]

[tool.setuptools.package-data]
crux = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
