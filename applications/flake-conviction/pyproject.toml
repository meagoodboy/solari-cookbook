[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flake-conviction"
version = "0.1.0"
description = "Convict the cause of a flaky test by rerunning it in attested snapshot clones on Solari"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # The distribution is crux-flaky; the bare name on PyPI is an unrelated client.
  # The import and the command it installs are both still crux.
  "crux-flaky>=0.2",
  "solari-sandbox>=0.2.0",
  "httpx>=0.24",
]

[tool.setuptools]
packages = ["flake_conviction"]

[tool.setuptools.package-data]
flake_conviction = ["fixture/*"]
